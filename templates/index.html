<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANSHARE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="nav">
        <div class="logo"></div>
        <div class="local-network"></div>
    </div>
    <div class="header">
        <div class="h1">
            Your Files. &nbsp;<span class="gradient-text">Your Network.</span>
        </div>
        <div class="h2">
            Fast, private file sharing across devices connected to your network.
        </div>
    </div>
    <section class="upload-card">
        <form class="drop-zone" action="/upload" method="POST" enctype="multipart/form-data">

            <div class="upload-icon">
                <img src="{{ url_for('static', filename='images/upload-cloud.svg') }}" alt="Upload">
            </div>

            <p class="drop-title">
                Select a file to upload
            </p>

            <p class="drop-subtitle">
                Choose a file or drag it here to share.
            </p>

            <input type="file" name="file" id="fileInput" required>

            <button type="submit" class="upload-btn">UPLOAD</button>

        </form>
    </section>
    <div class="shared-files">
        <div class="head">Shared files</div>

        {% for file in file_details %}
        <div class="file">
            <a href="{{ url_for('download_file', filename=file.name) }}">
                {{ file.name }}
            </a>
            <div class="size">{{ file.size }}</div>
        </div>
        {% endfor %}

    </div>

    <script>
        const dropZone = document.querySelector(".drop-zone");
        const fileInput = document.querySelector("#fileInput");

        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("drag-over");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("drag-over");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();

            dropZone.classList.remove("drag-over");

            const files = e.dataTransfer.files;

            if (files.length > 0) {
                fileInput.files = files;
            }
        });
    </script>

</body>

</html>
